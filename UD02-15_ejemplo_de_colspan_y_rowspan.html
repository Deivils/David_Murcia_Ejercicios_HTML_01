<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colspan y Rowspan</title>
</head>
<body>
    <h2>Fusión de Tablas</h2>
    <table  border="">
        <tr>
            <td colspan="2">A</td>
        </tr>

        <tr>
            <td>B</td>
            <td>C</td>
        </tr>
    </table>
    <br>
    <h2>Fusión de columnas</h2>

    <table border="">
        <tr>
            <td>D</td>
            <td>E</td>
        </tr>

        <tr>
            <td rowspan="2">F</td>
        </tr>
        
    </table>
</body>
</html>
