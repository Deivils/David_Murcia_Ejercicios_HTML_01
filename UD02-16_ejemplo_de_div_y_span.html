    <title>Div y Span</title>
</head>
<body>
    <div id="rojo" style="background-color: red;">
        <h1>Titulo en contenedor Rojo</h1>
        <div id="azul" style="background-color: blue;">
            <p>Este es un párrafo dentro de un contenedor div co fondo rojo y que a su vez esta dentro de otro contenedor div con fondo azul</p>
        </div>
    </div>
    <div id="verde" style="background-color: green;">
        <h2>Subtitulo en contenedor verde</h2>
    </div>
</body>
